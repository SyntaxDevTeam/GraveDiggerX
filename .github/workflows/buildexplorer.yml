name: Build and publish GraveDiggerX

on:
  push:
    branches:
      - main
      - 'experimental/**'
      - 'experimental-*'
  pull_request:
    branches:
      - main
      - 'experimental/**'
      - 'experimental-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  MINI_PORTAL_URL: https://syntaxdevteam.pl
  BUILD_PROJECT: gravediggerx
  BUILD_PLATFORM: paper
  BUILD_PLATFORM_FAMILY: server
  BUILD_GRADLE_TASK: build
  BUILD_GRADLE_PROPERTIES_TASK: properties
  BUILD_JAR_DIR: build/libs
  BUILD_ARTIFACT_PREFIX: GraveDiggerX-
  BUILD_GAME_VERSION_SOURCE: src/main/kotlin/pl/syntaxdevteam/gravediggerx/common/VersionChecker.kt
  BUILD_GAME_VERSION_MODE: version_checker

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          chmod +x ./gradlew
          ./gradlew test --console=plain --no-daemon

  publish:
    name: Publish gravediggerx / paper
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          chmod +x ./gradlew
          ./gradlew "${BUILD_GRADLE_TASK}" --console=plain --no-daemon

      - name: Publish artifact to Build Explorer v2
        env:
          BUILD_CI_TOKEN: ${{ secrets.BUILD_CI_TOKEN }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_CI_TOKEN}" ]; then
            echo "Missing BUILD_CI_TOKEN repository secret." >&2
            exit 1
          fi

          if [ ! -d "${BUILD_JAR_DIR}" ]; then
            echo "Directory ${BUILD_JAR_DIR} does not exist for ${BUILD_PROJECT}." >&2
            exit 1
          fi

          jar="$(python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          jar_dir = Path(os.environ["BUILD_JAR_DIR"])
          prefix = os.environ["BUILD_ARTIFACT_PREFIX"]
          excluded_suffixes = ("-sources.jar", "-javadoc.jar", "-plain.jar", "-original.jar")
          candidates = [
              path for path in jar_dir.glob("*.jar")
              if not path.name.endswith(excluded_suffixes)
          ]
          preferred = [path for path in candidates if path.name.startswith(prefix)]
          pool = preferred or candidates
          if not pool:
              sys.exit(1)
          print(max(pool, key=lambda path: path.stat().st_size))
          PY
          )"
          if [ -z "${jar}" ]; then
            echo "No JAR found for ${BUILD_PROJECT} in ${BUILD_JAR_DIR}." >&2
            exit 1
          fi

          version="$(./gradlew -q "${BUILD_GRADLE_PROPERTIES_TASK}" --console=plain --no-daemon | awk -F': ' '$1 == "version" {print $2; exit}' | tr -d '\r')"
          if [ -z "${version}" ] || [ "${version}" = "unspecified" ]; then
            version="${GITHUB_SHA::12}"
          fi

          artifact_base="$(basename "${jar}" .jar)"
          artifact_upper="${artifact_base^^}"
          if [[ "${GITHUB_REF_NAME_VALUE}" == experimental/* || "${GITHUB_REF_NAME_VALUE}" == experimental-* ]]; then
            channel="wip"
          elif [[ "${artifact_upper}" == *"-WIP"* || "${artifact_upper}" == *"-PREALPHA"* || "${artifact_upper}" == *"-ALPHA"* ]]; then
            channel="wip"
          elif [[ "${artifact_upper}" == *"-DEV"* ]]; then
            channel="dev"
          elif [[ "${artifact_upper}" == *"-SNAPSHOT"* || "${artifact_upper}" == *"-BETA"* || "${artifact_upper}" == *"-RC"* ]]; then
            channel="snapshot"
          else
            channel="release"
          fi

          game_versions="$(python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          source = Path(os.environ["BUILD_GAME_VERSION_SOURCE"])
          mode = os.environ["BUILD_GAME_VERSION_MODE"]
          if not source.is_file():
              raise SystemExit(f"Game version source {source} does not exist.")

          text = source.read_text(encoding="utf-8")
          versions = []

          if mode == "version_checker":
              triples = re.findall(
                  r"SemanticVersion\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)",
                  text,
              )
              if triples:
                  versions.extend(".".join(parts) for parts in triples)
              else:
                  versions.extend(re.findall(r'"(\d+(?:\.\d+){1,2})"', text))
          elif mode == "gradle_api":
              versions.extend(re.findall(r"(?:paper-api|spigot-api|folia-api):(\d+(?:\.\d+){1,2})", text))
              versions.extend(re.findall(r"(?:paper-api|spigot-api|folia-api)\s*=\s*" r'"(\d+(?:\.\d+){1,2})', text))
          else:
              raise SystemExit(f"Unsupported BUILD_GAME_VERSION_MODE: {mode}")

          normalized = []
          seen = set()
          for value in versions:
              parts = value.split(".")
              if len(parts) == 3 and parts[2] == "0":
                  value = ".".join(parts[:2])
              if value not in seen:
                  seen.add(value)
                  normalized.append(value)

          if not normalized:
              raise SystemExit(f"No Minecraft versions found in {source}.")

          print(json.dumps(normalized, separators=(",", ":")))
          PY
          )"

          if [ "${artifact_base%-${GITHUB_RUN_NUMBER_VALUE}}" != "${artifact_base}" ]; then
            filename="${artifact_base}.jar"
          else
            filename="${artifact_base}-${GITHUB_RUN_NUMBER_VALUE}.jar"
          fi

          sha256="$(sha256sum "${jar}" | awk '{print $1}')"
          size="$(stat -c%s "${jar}")"

          export BUILD_CHANNEL="${channel}"
          export BUILD_GAME_VERSIONS="${game_versions}"
          export BUILD_VERSION="${version}"
          export BUILD_FILENAME="${filename}"
          export BUILD_SHA256="${sha256}"
          export BUILD_SIZE="${size}"

          echo "Build Explorer channel: ${BUILD_CHANNEL}"
          echo "Minecraft versions: ${BUILD_GAME_VERSIONS}"

          python3 - <<'PY' > build-info.json
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          before = os.environ.get("GITHUB_BEFORE", "")
          after = os.environ["GITHUB_AFTER"]
          rev_range = after
          if before and before != "0000000000000000000000000000000000000000":
              rev_range = f"{before}..{after}"

          raw = subprocess.check_output(
              ["git", "log", "--format=%H%x1f%cI%x1f%s", rev_range],
              text=True,
          ).strip()
          commits = []
          for line in raw.splitlines():
              if not line:
                  continue
              sha, time, message = line.split("\x1f", 2)
              commits.append({"sha": sha, "time": time, "message": message})

          payload = {
              "id": int(os.environ["GITHUB_RUN_ID_VALUE"]),
              "time": datetime.now(timezone.utc).isoformat(),
              "channel": os.environ["BUILD_CHANNEL"],
              "platform": os.environ["BUILD_PLATFORM"],
              "compatible_platforms": [os.environ["BUILD_PLATFORM"]],
              "platform_family": os.environ["BUILD_PLATFORM_FAMILY"],
              "game_versions": json.loads(os.environ["BUILD_GAME_VERSIONS"]),
              "version": os.environ["BUILD_VERSION"],
              "build_number": os.environ["GITHUB_RUN_NUMBER_VALUE"],
              "branch": os.environ["GITHUB_REF_NAME_VALUE"],
              "commit_sha": after,
              "filename": os.environ["BUILD_FILENAME"],
              "sha256": os.environ["BUILD_SHA256"],
              "size": int(os.environ["BUILD_SIZE"]),
              "commits": commits[:100],
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          curl --fail-with-body \
            -X POST "${MINI_PORTAL_URL}/api/v2/builds/ci/${BUILD_PROJECT}" \
            -H "X-Build-Token: ${BUILD_CI_TOKEN}" \
            -F "metadata=<build-info.json;type=application/json" \
            -F "artifact=@${jar};filename=${filename};type=application/java-archive"
