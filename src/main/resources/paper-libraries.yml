repositories:
  syntaxdevteam-snapshots: "https://nexus.syntaxdevteam.pl/repository/maven-snapshots/"
  syntaxdevteam-releases: "https://nexus.syntaxdevteam.pl/repository/maven-releases/"
  central: "MAVEN_CENTRAL_DEFAULT_MIRROR"
  paper: "https://repo.papermc.io/repository/maven-public/"
  jitpack: "https://jitpack.io/"
  codemc-snapshots: "https://repo.codemc.io/repository/maven-snapshots/"

libraries:
  # Libraries required by the plugin
  - org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}
  - org.eclipse.aether:aether-api:1.1.0
  - org.yaml:snakeyaml:2.7
  - com.google.code.gson:gson:${gsonVersion}
  # Kyori Adventure libraries
  - net.kyori:adventure-text-minimessage:5.2.0
  - net.kyori:adventure-text-serializer-gson:5.2.0
  - net.kyori:adventure-text-serializer-legacy:5.2.0
  - net.kyori:adventure-text-serializer-plain:5.2.0
  - net.kyori:adventure-text-serializer-ansi:5.2.0
  # Caffeine caching library necessary for SyntaxCore and SyntaxMessages
  - com.github.ben-manes.caffeine:caffeine:3.3.1
  - pl.syntaxdevteam:messageHandler-paper:${messagehandlerVersion}
  - pl.syntaxdevteam:syntaxcore:${syntaxcoreVersion}
  # SyntaxDB and supported JDBC drivers
  - pl.syntaxdevteam:syntaxdb-core:${syntaxdbVersion}
  - com.zaxxer:HikariCP:${hikariVersion}
  - com.mysql:mysql-connector-j:${mysqlVersion}
  - com.google.protobuf:protobuf-java:${protobufVersion}
  - org.xerial:sqlite-jdbc:${sqliteVersion}
  - org.postgresql:postgresql:${postgresqlVersion}
